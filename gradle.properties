# Falsity — Gradle properties
# Version values verified against https://fabricmc.net/develop and the official
# FabricMC/fabric-example-mod `26.3` branch on 2026-11-10.

# Done to increase the memory available to Gradle (the Minecraft client needs room).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod properties
version=0.1.0
maven_group=com.falsity
archives_base_name=falsity

# Dependencies
fabric_api_version=0.165.2+26.3

# Java toolchain. Minecraft 26.3 requires Java 25 and Loom 1.19 requires the
# Gradle JVM itself to be Java 25.
java_version=25

# Data pack / resource pack format for Minecraft 26.3.
datapack_format=121
