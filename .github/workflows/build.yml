name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install asset tooling
        run: python3 -m pip install --upgrade pillow

      - name: Verify generated assets are current
        run: python3 tools/generate_assets.py --check

      - name: Validate resources statically
        run: python3 tools/validate_assets.py

      # Compiles both source sets, runs the unit tests and runs the server game
      # tests (Loom wires the game tests into `build`). The full output is kept so
      # it can be published when something fails.
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --warning-mode summary 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: falsity-jar
          path: build/libs/
          if-no-files-found: error

      # GitHub's log-download endpoints are not always reachable from every
      # environment, so on failure the full log is also pushed to a branch that
      # can be fetched with plain git.
      - name: Publish the build log to the ci-log branch
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/ci-log"
          cd "$RUNNER_TEMP/ci-log"
          git init -q
          git checkout -q -b ci-log
          cp "$GITHUB_WORKSPACE/build.log" build.log 2>/dev/null || echo "no build log captured" > build.log
          git add build.log
          git -c user.name="falsity-ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-log

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
