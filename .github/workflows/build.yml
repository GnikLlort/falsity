name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, test and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install asset tooling
        run: python3 -m pip install --upgrade pillow

      - name: Verify generated assets are current
        run: python3 tools/generate_assets.py --check

      - name: Validate resources statically
        run: python3 tools/validate_assets.py

      # Compiles both source sets, runs the unit tests and runs the server game
      # tests (Loom wires the game tests into `build`).
      - name: Build and test
        run: ./gradlew build --stacktrace --warning-mode summary

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: falsity-jar
          path: build/libs/
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/
            build/run-gametest/
          if-no-files-found: warn
