name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install asset tooling
        run: python3 -m pip install --upgrade pillow

      - name: Verify generated assets are current
        run: python3 tools/generate_assets.py --check

      - name: Validate resources statically
        run: python3 tools/validate_assets.py

      # Split into stages so a failure names the stage it came from, and so each
      # stage has its own annotation budget (GitHub surfaces only the first
      # handful of errors per step).
      - name: Compile the common sources
        run: ./gradlew compileJava --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Compile the client sources
        run: ./gradlew compileClientJava --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Run unit tests
        run: ./gradlew test --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      # This also runs the server game tests: Loom wires them into `build`.
      - name: Build and run game tests
        run: ./gradlew build --stacktrace --warning-mode summary 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: falsity-jar
          path: build/libs/
          if-no-files-found: error

      # GitHub's log-download endpoints are not reachable from every
      # environment, so on failure the relevant part of the log is also posted as
      # a commit comment, which plain `gh api` can read back.
      # GitHub's log-download endpoints are not reachable from every
      # environment, so the relevant part of the log is also posted as a commit
      # comment, which plain `gh api` can read back.
      - name: Publish the build log as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build.log ]; then
            echo "No build log was captured."
            exit 0
          fi
          {
            echo "Build result for ${GITHUB_SHA}"
            echo
            echo "== game tests and task outcomes =="
            grep -E "GameTest|gametest|BUILD SUCCESSFUL|BUILD FAILED|> Task .*(FAILED|NO-SOURCE)|tests completed|Test run" build.log | tail -80
            echo
            echo "== tasks executed by the build =="
            grep -E "^> Task " build.log | tail -60
            echo
            echo "== errors and warnings =="
            grep -n -E "error:|warning:|FAILURE|Caused by|Execution failed|at net\.|at com\." build.log | head -200
            echo
            echo "== tail =="
            tail -60 build.log
          } > summary.log 2>&1 || cp build.log summary.log
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat summary.log)" > /dev/null || echo "could not post the log comment"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn